# The palace-sleep bundle patch.
#
# Adding `dsh-palace-sleep` to a profile's `dsh.profile.bundles` applies this
# automatically. The entry name is the BARE package name on purpose — the
# client-module scanner resolves `<name>/package.json`, and a subpath fails.
#
# Everything here is optional; the defaults in src/index.js are the same values.
# `palaceDb` is single-quoted because a Windows path in a double-quoted YAML
# scalar would treat the backslashes as escapes.
- insert:
    - id: palace-sleep
      name: dsh-palace-sleep
      config:
        palaceDb: '~/KnowledgeBase/mempalace_kb/chroma.sqlite3'
        home: '~/.dsh/palace-sleep'
        # line | full | off — `line` is the default because a runtime context
        # block is assembled on every model step.
        injectMode: line
        scanIntervalMinutes: 720
        scanOnStart: true
